# Keeps the maps this repo serves in step with their sources, every day.
#
#  - Every script in scripts/ is run: PalmWatch, Trase (which rereads itself
#    only on Mondays, or when this is run by hand), the Google My Maps address
#    lookups, and any script added later, with no change needed here.
#  - The site's own maps that live on GitHub are reread with the culprits
#    repo's reader, so an edit to a map shows up in Culprits by the next day.
#
# It commits only when something changed, then asks GitHub Pages to republish.
name: refresh
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Every refresh script
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          for f in scripts/*.py; do
            echo "== $f"
            python3 "$f" || echo "$f failed; the last good copy stays."
          done

      - name: The site's own maps on GitHub
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/WelcomeToYourGalaxy/culprits.git "$RUNNER_TEMP/culprits"
          cd "$RUNNER_TEMP/culprits"
          IDS=$(python3 -c 'import json; print(",".join(m["id"] for m in json.load(open("pipeline/sitemaps/registry.json"))["maps"] if m.get("url") and m["id"] not in ("carbon_majors", "site_environment_law")))')
          python3 pipeline/sitemaps/build_boxes.py "$IDS"
          mkdir -p "$GITHUB_WORKSPACE/sitemaps"
          cp map/data/sitemaps/*.places.geojson map/data/sitemaps/*.boxes.json "$GITHUB_WORKSPACE/sitemaps/"

      - name: Commit what changed
        run: |
          git config user.name "culprits-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Refresh: every script and the site's own maps"
          # The run can take over an hour; anything pushed meanwhile is taken in first.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            echo "Push attempt $i did not go through; trying again."
            sleep 10
          done
          echo "CHANGED=1" >> "$GITHUB_ENV"

      - name: Republish Pages
        if: env.CHANGED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will republish on its own."
